<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/fliance-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fliance（梵响）— 数字资产交易平台</title>
    <script>
      // Theme bootstrap: apply the persisted theme before first paint to
      // avoid a dark→light flash. Mirrors src/store/themeStore.ts.
      try {
        document.documentElement.setAttribute(
          'data-theme',
          localStorage.getItem('fliance-theme') === 'light' ? 'light' : 'dark'
        );
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
