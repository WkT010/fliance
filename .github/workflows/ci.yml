name: CI
on: [push, pull_request]
env:
  GO_VERSION: "1.22"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "${{ env.GO_VERSION }}"}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with: {version: latest, args: --timeout=5m}
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: nexa, POSTGRES_PASSWORD: nexa_dev, POSTGRES_DB: nexa}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "${{ env.GO_VERSION }}"}
      - run: go mod download
      - run: go test -race -count=1 -v ./... 2>&1 | tee test-output.log
      - run: go test -bench=. -benchmem ./internal/matching/...
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: test-logs, path: test-output.log}
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "${{ env.GO_VERSION }}"}
      - run: CGO_ENABLED=0 GOOS=linux go build -ldflags='-s -w' -o build/ ./cmd/...
      - run: CGO_ENABLED=0 GOOS=linux go build -ldflags='-s -w' -o build/ ./scripts/migrate/
      - uses: actions/upload-artifact@v4
        with: {name: binaries, path: build/}
  docker:
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker build -t nexa/api-gateway:latest -f deploy/docker/Dockerfile.api-gateway .
          docker build -t nexa/matching-engine:latest -f deploy/docker/Dockerfile.matching-engine .
          docker build -t nexa/wallet-service:latest -f deploy/docker/Dockerfile.wallet-service .
