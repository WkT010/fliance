# =============================================================================
# Fliance（梵响） - Secret 模板（占位符，禁止提交真实值！）
# =============================================================================
# 本文件中的 stringData 值全部为占位符，真实值必须通过以下方式在部署环境注入：
#
# 方式一（推荐）：集群外创建，不进入版本库
#   kubectl -n fliance create secret generic fliance-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=GRPC_SHARED_TOKEN="$(openssl rand -base64 32)" \
#     --from-literal=POSTGRES_DSN="postgres://nexa:<强密码>@postgres:5432/nexa?sslmode=require" \
#     --from-literal=REDIS_PASSWORD="<强密码>" \
#     --from-literal=ALCHEMY_API_KEY="<你的API Key>"
#   （随后从 kustomization 的 resources 中移除本文件，避免 apply 覆盖）
#
# 方式二：SealedSecrets / ExternalSecrets
#   将本文件转换为 SealedSecret（kubeseal）或 ExternalSecret 资源，
#   加密后的密文才可提交到版本库。
#
# 安全要求：
#   - JWT_SECRET 至少 32 字节随机值（openssl rand -base64 48）
#   - GRPC_SHARED_TOKEN：matching-engine 在 ENVIRONMENT != development 时缺省会
#     log.Fatal 拒绝启动，生产必填（openssl rand -base64 32）
#   - 数据库/Redis 密码：16+ 位，含大小写、数字、特殊字符
#   - 定期轮换；任何真实值泄露到 Git 历史必须立即轮换
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: fliance-secrets
  namespace: fliance
type: Opaque
stringData:
  JWT_SECRET: "PLACEHOLDER-REPLACE-ME"
  # matching-engine gRPC 共享令牌：api-gateway 与 matching-engine 必须使用同一值；
  # 非 development 环境缺省会启动失败。生成：openssl rand -base64 32
  GRPC_SHARED_TOKEN: "PLACEHOLDER-REPLACE-ME"
  POSTGRES_DSN: "postgres://nexa:PLACEHOLDER-REPLACE-ME@postgres:5432/nexa?sslmode=disable"
  REDIS_PASSWORD: "PLACEHOLDER-REPLACE-ME"
  ALCHEMY_API_KEY: "PLACEHOLDER-REPLACE-ME"
