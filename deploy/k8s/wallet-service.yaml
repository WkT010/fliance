apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: fliance
spec:
  replicas: 2
  selector: {matchLabels: {app: wallet-service}}
  template:
    metadata:
      labels: {app: wallet-service}
    spec:
      containers:
        - name: wallet-service
          image: fliance/wallet-service:latest
          ports: [{containerPort: 8082, name: http}]
          envFrom: [{configMapRef: {name: fliance-config}}]
          env:
            - name: LISTEN_ADDR
              value: ":8082"
            # 敏感配置统一从 fliance-secrets 注入（禁止写入 ConfigMap/明文）
            - name: POSTGRES_DSN
              valueFrom: {secretKeyRef: {name: fliance-secrets, key: POSTGRES_DSN}}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: fliance-secrets, key: REDIS_PASSWORD}}
            - name: ALCHEMY_API_KEY
              valueFrom: {secretKeyRef: {name: fliance-secrets, key: ALCHEMY_API_KEY}}
          livenessProbe: {httpGet: {path: /health, port: 8082}, initialDelaySeconds: 10, periodSeconds: 30}
          readinessProbe: {httpGet: {path: /ready, port: 8082}, initialDelaySeconds: 5, periodSeconds: 10}
          resources: {limits: {cpu: "0.5", memory: 256Mi}, requests: {cpu: "0.25", memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-service
  namespace: fliance
spec:
  selector: {app: wallet-service}
  ports: [{port: 8082, targetPort: 8082}]
  type: ClusterIP
