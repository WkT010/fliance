apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: fliance
spec:
  replicas: 2
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata:
      labels: {app: api-gateway}
    spec:
      containers:
        - name: api-gateway
          image: fliance/api-gateway:latest
          ports: [{containerPort: 8080, name: http}]
          envFrom: [{configMapRef: {name: fliance-config}}]
          env:
            # 敏感配置统一从 fliance-secrets 注入（禁止写入 ConfigMap/明文）
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: fliance-secrets, key: JWT_SECRET}}
            - name: POSTGRES_DSN
              valueFrom: {secretKeyRef: {name: fliance-secrets, key: POSTGRES_DSN}}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: fliance-secrets, key: REDIS_PASSWORD}}
            - name: ALCHEMY_API_KEY
              valueFrom: {secretKeyRef: {name: fliance-secrets, key: ALCHEMY_API_KEY}}
            # gRPC 客户端凭证：必须与 matching-engine 的 GRPC_SHARED_TOKEN 一致
            - name: GRPC_SHARED_TOKEN
              valueFrom: {secretKeyRef: {name: fliance-secrets, key: GRPC_SHARED_TOKEN}}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 10, periodSeconds: 30}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
          resources: {limits: {cpu: "1", memory: 512Mi}, requests: {cpu: "0.5", memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: fliance
spec:
  selector: {app: api-gateway}
  ports: [{port: 8080, targetPort: 8080, name: http}]
  type: ClusterIP
