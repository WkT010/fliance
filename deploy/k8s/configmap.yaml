apiVersion: v1
kind: ConfigMap
metadata:
  name: nexa-config
  namespace: nexa
data:
  JWT_ISSUER: "nexa-exchange"
  LISTEN_ADDR: ":8080"
  ENVIRONMENT: "production"
  POSTGRES_DSN: "postgres://nexa:nexa_prod@postgres:5432/nexa?sslmode=disable"
  REDIS_ADDR: "redis:6379"
  KAFKA_BROKERS: "kafka:9092"
  TRADING_PAIRS: "BTC/USDT,ETH/USDT,SOL/USDT,BNB/USDT,ADA/USDT"
  WAL_DIR: "/data/wal"
  SNAPSHOT_DIR: "/data/snapshots"
  SNAPSHOT_INTERVAL: "60s"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
---
apiVersion: v1
kind: Secret
metadata:
  name: nexa-secrets
  namespace: nexa
type: Opaque
stringData:
  JWT_SECRET: "change-me-in-production"
  POSTGRES_PASSWORD: "nexa_prod"
  ALCHEMY_API_KEY: ""
