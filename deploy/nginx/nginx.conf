upstream api_backend {
    server api-gateway:8080 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

upstream ws_backend {
    server api-gateway:8080;
}

server {
    listen 80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /health { proxy_pass http://api_backend; }
    location /ready  { proxy_pass http://api_backend; }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    root /var/www/nexa-frontend;

    ssl_certificate     /etc/letsencrypt/live/nexa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexa/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;

    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=ws:10m rate=50r/s;
    limit_req_status 429;

    access_log /var/log/nginx/access.log combined buffer=512k flush=1m;
    error_log  /var/log/nginx/error.log warn;

    location /api/ {
        limit_req zone=api burst=200;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        add_header Access-Control-Allow-Origin ${CORS_ALLOW_ORIGINS:-https://nexa.exchange} always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-API-Key,X-Request-Id" always;
        add_header Access-Control-Allow-Credentials "true" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location /health { proxy_pass http://api_backend; }
    location /ready  { proxy_pass http://api_backend; }
    location /metrics {
        proxy_pass http://api_backend;
        allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16;
        deny all;
    }

    location /legal/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
    }

    location /ws {
        limit_req zone=ws burst=100;
        proxy_pass http://ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    error_page 429 /429.html;
    location = /429.html {
        internal;
        add_header Content-Type text/html;
        return 200 '<!DOCTYPE html><html><head><title>Rate Limit</title><meta charset="utf-8"><style>body{font-family:sans-serif;background:#0b0e11;color:#eaecef;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;text-align:center}div{max-width:400px}h1{color:#f0b90b}.gold{color:#f0b90b}</style></head><body><div><h1>429</h1><p>请求过于频繁，请稍后再试。</p><p class="gold">Rate limit exceeded. Please try again later.</p></div></body></html>';
    }
}