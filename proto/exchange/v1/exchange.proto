syntax = "proto3";

package exchange.v1;

option go_package = "github.com/WkT010/nexa-exchange/proto/exchange/v1;exchangev1";

// Side of an order. Values are prefixed to avoid C++ enum scoping collisions.
enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
  ORDER_TYPE_STOP_LOSS = 3;
  ORDER_TYPE_STOP_LIMIT = 4;
  ORDER_TYPE_ICEBERG = 5;
  ORDER_TYPE_FOK = 6;
  ORDER_TYPE_IOC = 7;
  ORDER_TYPE_POST_ONLY = 8;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
  TIME_IN_FORCE_GTD = 4;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_NEW = 1;
  ORDER_STATUS_PARTIALLY_FILLED = 2;
  ORDER_STATUS_FILLED = 3;
  ORDER_STATUS_CANCELLED = 4;
  ORDER_STATUS_REJECTED = 5;
  ORDER_STATUS_EXPIRED = 6;
}

enum TakerSide {
  TAKER_SIDE_UNSPECIFIED = 0;
  TAKER_SIDE_BUY = 1;
  TAKER_SIDE_SELL = 2;
}

message Order {
  string id = 1;
  string client_order_id = 2;
  string user_id = 3;
  string pair = 4;
  Side side = 5;
  OrderType type = 6;
  string price = 7;
  string stop_price = 8;
  string quantity = 9;
  string filled_qty = 10;
  string remaining_qty = 11;
  string iceberg_qty = 12;
  string visible_qty = 13;
  TimeInForce time_in_force = 14;
  OrderStatus status = 15;
  int64 created_at = 16;
  int64 updated_at = 17;
}

message Trade {
  string id = 1;
  string buy_order_id = 2;
  string sell_order_id = 3;
  string buyer_id = 4;
  string seller_id = 5;
  string pair = 6;
  string price = 7;
  string quantity = 8;
  TakerSide taker_side = 9;
  string fee = 10;
  int64 created_at = 11;
}

message PriceLevel {
  string price = 1;
  string quantity = 2;
  int64 count = 3;
}

message OrderBookDepth {
  string pair = 1;
  repeated PriceLevel bids = 2;
  repeated PriceLevel asks = 3;
  int64 seq_no = 4;
}

message Ticker {
  string pair = 1;
  string last_price = 2;
  string bid = 3;
  string ask = 4;
  string spread = 5;
  string volume_24h = 6;
  string quote_volume_24h = 7;
  string high_24h = 8;
  string low_24h = 9;
  string open_24h = 10;
  string change_24h = 11;
  string change_pct_24h = 12;
  int64 timestamp = 13;
}

message Candle {
  string pair = 1;
  string interval = 2;
  string open = 3;
  string high = 4;
  string low = 5;
  string close = 6;
  string volume = 7;
  int64 timestamp = 8;
  int64 close_time = 9;
}

message PlaceOrderRequest {
  string client_order_id = 1;
  string user_id = 2;
  string pair = 3;
  Side side = 4;
  OrderType type = 5;
  string price = 6;
  string stop_price = 7;
  string quantity = 8;
  string iceberg_qty = 9;
  string visible_qty = 10;
  TimeInForce time_in_force = 11;
}

message PlaceOrderResponse {
  Order order = 1;
  repeated Trade fills = 2;
}

message CancelOrderRequest {
  string order_id = 1;
  string user_id = 2;
  string pair = 3;
}

message CancelOrderResponse {
  bool success = 1;
  Order order = 2;
}

message GetOrderRequest {
  string order_id = 1;
  string pair = 2;
}

message GetOrderResponse {
  Order order = 1;
}

message GetOrderbookRequest {
  string pair = 1;
  int32 limit = 2;
}

message GetOrderbookResponse {
  OrderBookDepth depth = 1;
}

message GetTickerRequest {
  string pair = 1;
}

message GetTickerResponse {
  Ticker ticker = 1;
}

message GetCandlesRequest {
  string pair = 1;
  string interval = 2;
  int32 limit = 3;
  int64 start_time = 4;
  int64 end_time = 5;
}

message GetCandlesResponse {
  repeated Candle candles = 1;
}

message ListTradesRequest {
  string pair = 1;
  int32 limit = 2;
}

message ListTradesResponse {
  repeated Trade trades = 1;
}

message StreamTradesRequest {
  string pair = 1;
}

message StreamTradesResponse {
  Trade trade = 1;
}

message StreamOrderbookRequest {
  string pair = 1;
  int32 limit = 2;
}

message StreamOrderbookResponse {
  OrderBookDepth depth = 1;
}

message StreamTickerRequest {
  string pair = 1;
}

message StreamTickerResponse {
  Ticker ticker = 1;
}

service ExchangeService {
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc GetOrderbook(GetOrderbookRequest) returns (GetOrderbookResponse);
  rpc GetTicker(GetTickerRequest) returns (GetTickerResponse);
  rpc GetCandles(GetCandlesRequest) returns (GetCandlesResponse);
  rpc ListTrades(ListTradesRequest) returns (ListTradesResponse);
}

service StreamService {
  rpc StreamTrades(StreamTradesRequest) returns (stream StreamTradesResponse);
  rpc StreamOrderbook(StreamOrderbookRequest) returns (stream StreamOrderbookResponse);
  rpc StreamTicker(StreamTickerRequest) returns (stream StreamTickerResponse);
}
